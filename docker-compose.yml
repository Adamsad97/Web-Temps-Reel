services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - JWT_SECRET=avenir_bank_super_secret_jwt_2024
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend/src:/app/src
    networks:
      - avenir-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
      - INTERNAL_API_URL=http://backend:4000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    networks:
      - avenir-network

networks:
  avenir-network:
    driver: bridge
